version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10

    # vitest and @vitest/* must move in lockstep: @vitest/coverage-v8 pins
    # an exact `vitest` peer and refuses to run against a different version.
    # Ungrouped, Dependabot opens one PR per package and each fails alone
    # (vitest 5.0.1 split across #88/#89), so neither can ever go green.
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]

    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
      - "dependabot"
    commit-message:
      prefix: "ci"
